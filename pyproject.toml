[project]
name = "engineer-challenge"
version = "0.1.0"
description = "Safety-bounded voice patient agent for evaluating healthcare phone systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "python-multipart>=0.0.20,<1",
  "structlog>=25.4,<26",
  "twilio>=9.7,<10",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<16",
]

[project.scripts]
voicebot = "voicebot.cli:app"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pre-commit>=4.3,<5",
  "pyright>=1.1.405,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicebot"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
exclude = [".venv"]
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
